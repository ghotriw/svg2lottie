name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run tests
        run: cargo test --all-targets

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify packaging
        run: cargo publish --dry-run

  build-binaries:
    name: Build (${{ matrix.asset_name }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: svg2lottie
            asset_name: svg2lottie-linux-x86_64-gnu.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: svg2lottie
            asset_name: svg2lottie-linux-x86_64-musl.tar.gz
            use_musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: svg2lottie
            asset_name: svg2lottie-macos-universal.tar.gz
            is_macos: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: svg2lottie.exe
            asset_name: svg2lottie-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools (Linux musl)
        if: matrix.use_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain (Standard)
        if: "!matrix.is_macos"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust toolchain (macOS Universal)
        if: matrix.is_macos
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build binary (Standard)
        if: "!matrix.is_macos"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Universal binary (macOS)
        if: matrix.is_macos
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output svg2lottie \
            target/aarch64-apple-darwin/release/svg2lottie \
            target/x86_64-apple-darwin/release/svg2lottie
          file svg2lottie

      - name: Package binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          cd ../../..

      - name: Package binary (macOS Universal)
        if: matrix.is_macos
        run: |
          tar -czvf ${{ matrix.asset_name }} svg2lottie

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  publish-crates-io:
    name: Publish to Crates.io
    needs: [test, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
