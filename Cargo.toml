[package]
name = "svg2lottie"
version = "0.1.1"
edition = "2024"
description = "SVG to Lottie JSON and Telegram TGS converter"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ghotriw/svg2lottie"
keywords = ["svg", "lottie", "tgs", "telegram", "vector"]
categories = ["graphics", "multimedia::images", "command-line-utilities"]

[lib]
name = "svg2lottie"
path = "src/lib.rs"

[[bin]]
name = "svg2lottie"
path = "src/main.rs"

[dependencies]
usvg = "0.48.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1.0"
clap = { version = "4.5", features = ["derive"] }
